# A股数据系统配置
# 优先级: 环境变量 > config.yaml > 默认值

# 默认监控股票列表
watchlist:
  - "600036"   # 招商银行
  - "000858"   # 五粮液
  - "300750"   # 宁德时代
  - "601318"   # 中国平安
  - "600519"   # 贵州茅台
  - "000333"   # 美的集团
  - "002594"   # 比亚迪
  - "688981"   # 中芯国际

# 数据源偏好（按优先级排列）
data_sources:
  quote: ["tencent", "mootdx"]   # 行情源
  research: ["akshare_eastmoney"] # 研报
  signal: ["akshare_eastmoney"]   # 信号
  news: ["akshare"]               # 新闻
  finance: ["akshare_eastmoney"]  # 财务
  announce: ["akshare_cninfo"]    # 公告

# 网络配置
network:
  timeout: 10          # 请求超时(秒)
  retry: 2             # 重试次数
  retry_delay: 1.0     # 重试间隔(秒)

# 输出配置
output:
  format: "table"      # table | json | csv
  max_rows: 30         # 最大显示行数
